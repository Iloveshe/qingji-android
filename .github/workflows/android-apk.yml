name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36 and Build Tools
        run: |
          python3 - <<'PY'
          import subprocess
          subprocess.run(['sdkmanager', 'platforms;android-36', 'build-tools;35.0.0', 'platform-tools'], input=('y\n' * 100).encode(), check=True)
          PY
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test transaction rules
        run: bash scripts/test-core.sh
      - name: Test database migration
        run: python3 tests/test-storage-migration.py
      - name: Test ledger storage, build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qingji-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload ledger test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
