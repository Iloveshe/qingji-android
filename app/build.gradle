plugins { id 'com.android.application' }
android {
    namespace 'com.qingji.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.qingji.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    // Align the OCR SDK's older Kotlin adapters with AndroidX's merged stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // Bundled Chinese OCR: recognition works without downloading a model on the phone.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}
