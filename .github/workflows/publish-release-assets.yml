name: Publish verified release assets

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release-assets.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag
        required: true
        default: v0.1.0
      assets_ref:
        description: Git ref containing the verified release files
        required: true
        default: release-assets/v0.1.0

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch the verified binaries
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.assets_ref || 'release-assets/v0.1.0' }}
          path: release-files
          persist-credentials: false
      - name: Verify and publish the existing build
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v0.1.0' }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Invalid release tag')
          files = [
              'qingji-0.1.0-debug.apk', 'qingji-app.zip',
              'qingji-android-source.zip', 'qingji-0.1.0-debug.apk.sha256',
              'qingji-apk-verification.json', 'qingji-install-guide.md', 'SHA256SUMS.txt'
          ]
          for name in files:
              subprocess.run(['gh', 'release', 'upload', tag, name, '--clobber'], check=True)
          response = subprocess.check_output(
              ['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/releases'], text=True)
          matches = [item for item in json.loads(response) if item['tag_name'] == tag]
          if len(matches) != 1:
              raise SystemExit('Cannot identify the intended draft release')
          release = matches[0]
          uploaded = {asset['name']: asset for asset in release['assets']}
          for name in files:
              path = pathlib.Path(name)
              asset = uploaded[name]
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if asset['state'] != 'uploaded' or asset['size'] != path.stat().st_size:
                  raise SystemExit('Upload size/state mismatch: ' + name)
              if asset.get('digest') and asset['digest'] != digest:
                  raise SystemExit('Upload digest mismatch: ' + name)
          subprocess.run(['gh', 'release', 'edit', tag, '--target', os.environ['SOURCE_COMMIT'],
                          '--draft=false', '--prerelease'], check=True)
          print('All seven release files verified and published')
          PY
